name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm compile
      - run: pnpm exec vp test run scripts/cws-lib.test.mjs scripts/cws-tag-gate.test.mjs scripts/cws-master-gate.test.mjs scripts/cws-plan-boundaries.test.mjs scripts/ci/cws-production-env-guard.test.mjs
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/smoke-verify.mjs
      - run: node scripts/verify-versions.mjs
      - run: node scripts/cws.mjs plan --dry-run --mock-status @scripts/fixtures/cws-store-published-1.8.4.mock.json
      - run: node scripts/scan-release-artifacts.mjs
      - run: node scripts/verify-doc-links.mjs
