name: chrome-web-store

# Production upload only — never on pull_request; no secrets on untrusted refs.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch or tag to build (default main)"
        required: false
        default: main
      publish:
        description: "Submit uploaded package for review after upload (does not cancel in-review items)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrome-web-store-${{ github.repository }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - name: Block pull_request
        if: github.event_name == 'pull_request'
        run: |
          echo "This workflow must not run on pull_request."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Production public env
        run: |
          for key in WXT_PUBLIC_SUPABASE_URL WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY WXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done
          {
            echo "WXT_PUBLIC_SUPABASE_URL=${WXT_PUBLIC_SUPABASE_URL}"
            echo "WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            echo "WXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${WXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID}"
          } > .env.production.local
          if [ -n "${WXT_PUBLIC_ANALYTICS_ENDPOINT}" ]; then
            echo "WXT_PUBLIC_ANALYTICS_ENDPOINT=${WXT_PUBLIC_ANALYTICS_ENDPOINT}" >> .env.production.local
          fi
        env:
          WXT_PUBLIC_SUPABASE_URL: ${{ secrets.WXT_PUBLIC_SUPABASE_URL }}
          WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          WXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.WXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
          WXT_PUBLIC_ANALYTICS_ENDPOINT: ${{ secrets.WXT_PUBLIC_ANALYTICS_ENDPOINT }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      - run: pnpm build
      - run: node scripts/smoke-verify.mjs
      - run: pnpm exec wxt zip
      - run: node scripts/package-artifacts.mjs
      - name: Upload to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: dakdgplahfkbblfpafdjeipneioajgdf
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: node scripts/upload-chrome-web-store.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-store-upload-${{ github.run_id }}
          path: |
            dist-artifacts/